name: Ping search engines (IndexNow)
# Runs when a page's content changed: the build updates src/verify/seo/lastmod.json only then
# (code and style changes don't count), and only the pages whose date or fingerprint changed are sent.
on:
  push:
    branches: [main]
    paths: ['src/verify/seo/lastmod.json']
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Wait for GitHub Pages to publish
        run: sleep 480    # "Test and publish" tests, then publishes this push, usually within 6 minutes; pinging sooner sends the old pages
      - name: Tell IndexNow which pages changed
        run: |
          python3 - <<'PY'
          import json, subprocess, urllib.request
          new = json.load(open('src/verify/seo/lastmod.json'))
          base = '${{ github.event.before }}'
          subprocess.run(['git', 'fetch', '--depth=1', 'origin', base])
          before = subprocess.run(['git', 'show', base + ':src/verify/seo/lastmod.json'], capture_output=True, text=True)
          old = json.loads(before.stdout) if before.returncode == 0 else {}   # no earlier version (new file or force push): send every page
          urls = sorted(u for u, v in new.items() if old.get(u) != v)
          print('changed:', urls)
          if urls:
              body = json.dumps({"host": "www.ebikerebatefinder.com", "key": "3ef55a8fd8c77a4982e3f3d6703f0926",
                                 "keyLocation": "https://www.ebikerebatefinder.com/3ef55a8fd8c77a4982e3f3d6703f0926.txt",
                                 "urlList": urls}).encode()
              req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body, method="POST",
                                           headers={"Content-Type": "application/json; charset=utf-8"})
              with urllib.request.urlopen(req) as r:
                  print('IndexNow:', r.status)
          PY

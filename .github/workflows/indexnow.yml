name: Ping search engines (IndexNow)
on:
  push:
    branches: [main]
    paths: ['index.html', 'llms.txt', 'llms-full.txt', 'sitemap.xml']
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages to publish
        run: sleep 90
      - name: Tell IndexNow the page changed
        run: |
          curl -s -o /dev/null -w "IndexNow: %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"ratsuns.github.io","key":"3ef55a8fd8c77a4982e3f3d6703f0926","keyLocation":"https://ratsuns.github.io/ava-bike-finder/3ef55a8fd8c77a4982e3f3d6703f0926.txt","urlList":["https://ratsuns.github.io/ava-bike-finder/","https://ratsuns.github.io/ava-bike-finder/llms.txt","https://ratsuns.github.io/ava-bike-finder/llms-full.txt"]}'

__HEAD__
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap" rel="stylesheet">
<style>
/* home page rules this page uses (build2.py copies them from site_tpl.html, so tokens, themes and the shop cards stay identical) */
__BASE_CSS__
/* shops page */
:root{--mapbg:#f8f4f0}
.sbar{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top,0px);--hink:18,22,20}
:root[data-theme="dark"] .sbar{--hink:238,241,238}
/* the same top nav and phone menu as the home page, in the page's text colours instead of over the video */
.sbar .topnav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px;padding-block:0;max-width:1440px}
.navlinks a[aria-current="page"]{color:rgb(var(--hink))}
.navmenu .wrap{padding-block:0;display:block}
.navmenu .nmh .wrap{display:flex}
/* the E-bike guide and Rebate info side panels (same as the home page) and the dimmed page behind them */
#scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s var(--ease-out)}
#scrim.on{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){#scrim{transition:none}}
/* hero: big title like the home page, over a dotted world map (dots near the pointer twinkle; the Bay Area glows in the accent colour) */
.sphero{position:relative;isolation:isolate;overflow:hidden;display:grid;place-items:center;text-align:center;min-height:clamp(280px,46vh,460px);min-height:clamp(280px,46svh,460px);--ov:40px}
.spdots{position:absolute;inset:0;width:100%;height:100%;z-index:-2;display:block}
.sphero-in{padding-block:56px calc(56px + var(--ov))}
.sphero h1{margin:0 auto;font-size:clamp(40px,6vw,72px);line-height:1.02;letter-spacing:-.035em;font-weight:700;text-wrap:balance}
.sphero .lede{margin:16px auto 0;color:var(--fg2);font-size:clamp(16px,1.5vw,19px);line-height:1.55;max-width:52ch;text-wrap:balance}
/* the cards and the map start slightly over the bottom of the hero (no divider lines) */
.spg{position:relative;z-index:1;margin-top:-40px;max-width:1440px;padding-block:0 72px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr);grid-template-areas:"map" "count" "list"}
/* "Where to buy" and the shop count sit at the top left, right above the list */
.sphead{grid-area:count;align-self:end;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;column-gap:10px}
.sphead h2{margin:0;font-size:var(--t-h2);line-height:1.2;letter-spacing:-.025em;font-weight:700;text-wrap:balance}
.spcount{margin:0;font-size:var(--t-ui);color:var(--fg2)}
.spcount b{color:var(--fg);font-weight:600}
.spmap{grid-area:map;position:relative;height:clamp(280px,45vh,460px);height:clamp(280px,45svh,460px);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--mapbg);isolation:isolate}
.splist{grid-area:list;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-content:start}
@media (min-width:1024px){
 .sphero{--ov:56px;min-height:clamp(380px,50vh,500px);min-height:clamp(380px,50svh,500px)}
 .spg{margin-top:-56px;grid-template-columns:minmax(360px,440px) minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"count ." "list map";column-gap:24px;row-gap:12px}
 .spmap{position:sticky;top:72px;align-self:start;height:calc(100vh - 88px);height:calc(100svh - 88px)}
 .splist{grid-template-columns:minmax(0,1fr)}
 .spsheet{display:contents}
 .shandle{display:none}
}
/* phones and tablets: a map view like the Google Maps app. No hero and no page scroll: the map fills the screen under the nav,
   a row of shop cards sits at its bottom, and "Show list" slides the full list up over the map */
.sphead .dclose{display:none}
@media (max-width:1023px){
 html,body{overflow:hidden;overscroll-behavior:none}
 .sphero{display:none}
 .spg{display:block;max-width:none;margin:0;padding:0;height:calc(100vh - 64px - env(safe-area-inset-top,0px));height:calc(100dvh - 64px - env(safe-area-inset-top,0px));overflow:hidden}
 .spmap{position:absolute;inset:0;height:auto;border:0;border-radius:16px 16px 0 0}
 .spsheet{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;background:var(--bg);border-radius:16px 16px 0 0;box-shadow:0 -1px 0 var(--line);
  transform:translateY(100%);visibility:hidden;transition:transform .32s var(--ease-drawer),visibility 0s linear .32s;will-change:transform}
 .spsheet.open{transform:none;visibility:visible;transition:transform .32s var(--ease-drawer),visibility 0s}
 .spg.nomap .spsheet{transform:none;visibility:visible}
 .spg.nomap .sphead .dclose,.spg.nomap .shandle{display:none}
 .shandle{flex:none;width:40px;height:5px;border-radius:3px;background:var(--line2);margin:8px auto 2px}
 .spsheet .sphead{flex:none;align-self:stretch;flex-wrap:nowrap;align-items:center;column-gap:12px;padding:4px 6px 10px 16px;-webkit-user-select:none;user-select:none}
 .spsheet .sphead h2{flex:1;min-width:0}
 .sphead .dclose{display:grid;touch-action:manipulation}
 /* the sheet handles vertical drags on its handle and heading; sideways stays with the browser */
 .shandle,.spsheet .sphead{touch-action:pan-x}
 .spsheet .splist{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 12px calc(20px + env(safe-area-inset-bottom,0px))}
 .splist .shop{scroll-margin:8px}
}
@media (max-width:1023px) and (prefers-reduced-motion:reduce){
 .spsheet{transform:none;opacity:0;transition:opacity .2s ease,visibility 0s linear .2s}
 .spsheet.open{opacity:1;transition:opacity .2s ease,visibility 0s}
}

.splist .shop{scroll-margin:72px 0 16px}
.shop.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
/* clicking a shop card shows it on the map */
.splist.hasmap .shop{cursor:pointer;transition:border-color .15s ease}
@media (hover:hover) and (pointer:fine){.splist.hasmap .shop:not(.on):hover{border-color:var(--line2)}}
.spmap.nomap::after{content:"The map couldn't load. Every shop is listed here.";position:absolute;inset:0;z-index:10;background:var(--mapbg);display:grid;place-items:center;padding:24px;text-align:center;color:var(--fg2);font-size:var(--t-ui)}
/* pins: one per shop, in the site's green with a white ring; the open or hovered one grows a little and sits on top */
.pin{display:block;width:32px;height:40px;padding:4px 2px 0;margin:0;border:0;background:none;cursor:pointer;touch-action:manipulation}
.pin svg{display:block;width:28px;height:36px;transform-origin:50% 100%;transition:transform .15s var(--ease-out);filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.35))}
/* shops are light blue pins; the picked shop's pin is red (same in both themes, since the map looks the same in both) */
.pin .pb{fill:#4da3f0;stroke:#fff;stroke-width:2}
.pin .pd{fill:#fff}
.maplibregl-marker.pin.hot{z-index:3}
.maplibregl-marker.pin.sel{z-index:4}
.pin.hot svg,.pin.sel svg{transform:scale(1.2)}
.pin.sel .pb{fill:#e5392f}
.pin:focus-visible{outline:none}
.pin:focus-visible svg{outline:2px solid var(--fg);outline-offset:1px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%}
/* hover card: one element, reused for every pin; it grows out of the pin (or drops below it near the top edge) */
.maplibregl-marker.mcw{z-index:6;pointer-events:none}
.mcard{width:296px;max-width:calc(100vw - 58px);display:grid;gap:10px;padding:14px 16px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;font-size:var(--t-ui);line-height:1.45;text-align:left;
 box-shadow:0 1px 2px rgba(18,22,20,.06),0 12px 32px rgba(18,22,20,.16);
 pointer-events:none;visibility:hidden;opacity:0;transform:scale(.96);transition:opacity .12s var(--ease-out),transform .12s var(--ease-out),visibility 0s linear .12s}
.mcard.open{pointer-events:auto;visibility:visible;opacity:1;transform:none;transition:opacity .15s var(--ease-out),transform .15s var(--ease-out),visibility 0s}
:root[data-theme="dark"] .mcard{border-color:var(--line2);box-shadow:0 2px 6px rgba(0,0,0,.35),0 16px 40px rgba(0,0,0,.55)}
@media (prefers-reduced-motion:reduce){.mcard,.mcard.open{transform:none}.pin svg{transition:none}}
/* phones and tablets: "Show list" and a row of shop cards at the bottom of the map; swipe the row left or right to go through the shops */
.mdock{display:none}
@media (max-width:1023px){
 .mdock{display:flex;flex-direction:column;align-items:center;position:absolute;left:0;right:0;bottom:0;z-index:5;padding-bottom:env(safe-area-inset-bottom,0px);pointer-events:none;
  transition:opacity .15s var(--ease-out),visibility 0s}
 .spg.listing .mdock{opacity:0;visibility:hidden;transition:opacity .12s var(--ease-out),visibility 0s linear .12s}
 .mlist{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px 0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);
  font:inherit;font-size:var(--t-ui);font-weight:600;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;
  box-shadow:0 1px 2px rgba(18,22,20,.06),0 4px 14px rgba(18,22,20,.14);transition:transform .12s var(--ease-out);will-change:translate}
 .mlist svg{color:var(--fg2)}
 .mlist:active{transform:scale(.97)}
 .mlist:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
 :root[data-theme="dark"] .mlist{border-color:var(--line2);box-shadow:0 1px 3px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.5)}
 .mcar{display:flex;align-self:stretch;align-items:flex-end;gap:10px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scroll-padding-inline:20px;padding:10px 20px 12px;scrollbar-width:none;touch-action:pan-x;pointer-events:auto}
 .mcar::-webkit-scrollbar{display:none}
 .mcar .mcard{flex:0 0 calc(100% - 16px);max-width:440px;width:auto;scroll-snap-align:center;scroll-snap-stop:always;pointer-events:auto;visibility:visible;opacity:1;transform:none;transition:none;box-shadow:0 1px 2px rgba(18,22,20,.06),0 4px 14px rgba(18,22,20,.14)}
 :root[data-theme="dark"] .mcar .mcard{box-shadow:0 1px 3px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.5)}
 /* details in two columns: address and phone | the week's hours, then the email */
 .mcgrid{display:grid;grid-template-columns:fit-content(132px) minmax(0,1fr);column-gap:12px;align-items:start;font-size:var(--t-meta);line-height:1.4}
 .mcgrid .mclines{gap:2px}
 .mcgrid a.mcl[href^="tel:"]{white-space:nowrap}
 .mchrs ul{list-style:none;margin:0;padding:0;display:grid;gap:0}
}
@media (prefers-reduced-motion:reduce){.mlist{transition:none}.mlist:active{transform:none}}
.mctop{display:flex;align-items:center;gap:10px;min-width:0}
.mctop .slogo{margin:0}
.mcname{display:grid;min-width:0;overflow-wrap:anywhere}
.mcname .city{color:var(--accent-ink);font-weight:600;font-size:var(--t-micro)}
.mcname b{font-size:var(--t-body);font-weight:600;line-height:1.3}
.mclines{display:grid;gap:3px;color:var(--fg2)}
.mcl{display:flex;align-items:flex-start;gap:6px;color:inherit;text-decoration:none;width:fit-content;overflow-wrap:anywhere}
.mcl svg{flex:none;margin-top:calc((1lh - 13px) / 2);color:var(--fg3)}
a.mcl span{text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.mcacts{display:flex;gap:8px;flex-wrap:wrap}
.mcbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:6px;border:1px solid var(--line2);background:var(--surface);color:var(--fg);font-weight:600;font-size:var(--t-ui);text-decoration:none;transition:background-color .15s ease,border-color .15s ease}
.mcbtn svg{color:var(--fg3)}
.mcbtn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
@media (hover:hover) and (pointer:fine){a.mcl:hover{color:var(--fg)}a.mcl:hover span{text-decoration-color:currentColor}.mcbtn:hover{border-color:var(--fg3)}.mcbtn.pri:hover{background:var(--accent-ink);border-color:var(--accent-ink)}:root[data-theme="dark"] .mcbtn.pri:hover{background:#3cc08c;border-color:#3cc08c}}
@media (pointer:coarse){.mcbtn{height:40px}.mcl{padding-block:3px}}
/* map controls in the site's colors */
.spmap .maplibregl-ctrl-group,.spmap .maplibregl-ctrl-attrib.maplibregl-compact{box-shadow:0 0 0 1px rgba(18,22,20,.08),0 1px 3px rgba(18,22,20,.14)}
.spmap .maplibregl-ctrl-group{background:#fff;border-radius:8px}
.spmap .maplibregl-ctrl-group button+button{border-top-color:#e3e7e2}
.spmap .maplibregl-ctrl-attrib{font-family:var(--font);font-size:11px;color:#4d5651}
.spmap .maplibregl-ctrl-attrib a{color:#4d5651}
.spmap .maplibregl-ctrl-attrib.maplibregl-compact{background:#fff}
/* "find me" button (under the zoom buttons), your location dot, and a short note if location isn't available */
.spmap .mloc{display:grid;place-items:center;color:#333;touch-action:manipulation}
.spmap .mloc[aria-busy="true"]{color:var(--accent-ink)}
.spmap .me{width:12px;height:12px}
.spmap .me::after{content:"";position:absolute;inset:0;border-radius:50%;background:#4285f4;box-shadow:0 0 0 2.5px #fff,0 1px 3px 2.5px rgba(0,0,0,.2)}
/* the soft blue ring around your dot breathes slowly (transform and opacity only, so it costs nothing while the map moves) */
.spmap .me::before{content:"";position:absolute;inset:-11px;border-radius:50%;background:rgba(66,133,244,.22);animation:mepulse 2.6s cubic-bezier(0.77,0,0.175,1) infinite alternate}
@keyframes mepulse{from{transform:scale(.7);opacity:1}to{transform:scale(1.1);opacity:.55}}
@media (prefers-reduced-motion:reduce){.spmap .me::before{animation:none}}
.spmap .mtoast{position:absolute;left:50%;top:12px;z-index:6;max-width:calc(100% - 120px);transform:translate(-50%,-6px);opacity:0;visibility:hidden;pointer-events:none;padding:8px 12px;border-radius:8px;background:#1f2937;color:#fff;font-size:var(--t-ui);line-height:1.35;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:opacity .18s var(--ease-out),transform .18s var(--ease-out),visibility 0s linear .18s}
.spmap .mtoast.on{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .18s var(--ease-out),transform .18s var(--ease-out),visibility 0s}
@media (prefers-reduced-motion:reduce){.spmap .mtoast{transform:translate(-50%,0)}}
</style>
</head><body data-overlayscrollbars-initialize style="margin:0">
<header class="sbar">__NAV__</header>
<section class="sphero" aria-labelledby="sph"><canvas class="spdots" aria-hidden="true"></canvas><div class="wrap sphero-in"><h1 id="sph">Vendor directory</h1><p class="lede">Every participating shop. Call ahead to check stock; the rebate only works in person.</p></div></section>
<main class="wrap spg">
<div class="spmap" id="map" role="region" aria-label="Map of the shops"><div class="mdock"><button type="button" class="mlist" aria-controls="sheet" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>Show list</button><div class="mcar" role="region" aria-label="Shops (swipe for more)"></div></div></div>
<section class="spsheet" id="sheet" aria-labelledby="sph2"><div class="shandle" aria-hidden="true"></div><div class="sphead"><h2 id="sph2">Where to buy</h2><p class="spcount"><b>__COUNT__</b> shops</p><button type="button" class="dclose" aria-label="Close list"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
<div class="splist" id="list"></div></section>
</main>

<script>
/* shop cards: drawn right away from the inline list, with the same helpers and markup as the home page's "Where to buy" */
const SH=__SHOPS__;
const $=id=>document.getElementById(id);
__HELPERS__
SH.sort((a,b)=>(a.city||'').localeCompare(b.city||'')||a.name.localeCompare(b.name));
/* the first few logos load right away; the rest wait until they're scrolled near */
$('list').innerHTML=SH.map((s,i)=>{const h=__CARD__;return i<6?h.replace('loading="lazy"','loading="eager"'):h}).join('');
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)');
/* light / dark toggle: same as the home page (remembered per browser, crossfades where view transitions exist) */
(()=>{const b=$('themebtn');if(!b)return;const H=document.documentElement;
 const cur=()=>H.dataset.theme==='light'?'light':'dark';

 const apply=t=>{H.dataset.theme=t;const cs=document.querySelector('meta[name="color-scheme"]'),tc=document.querySelector('meta[name="theme-color"]');if(cs)cs.content=t;if(tc)tc.content=t==='light'?'#f6f7f5':'#0f1211';try{localStorage.setItem('theme',t)}catch(e){}label()};

  if(document.startViewTransition&&!REDUCE.matches){b.style.viewTransitionName='themebtn';const vt=document.startViewTransition(()=>apply(next));vt.finished.finally(()=>{b.style.viewTransitionName=''})}else apply(next)})})();

(()=>{const sec=document.querySelector('.sphero'),cv=sec&&sec.querySelector('.spdots');if(!cv||!cv.getContext)return;const W=__WORLD__;
 const bits=Uint8Array.from(atob(W.b),c=>c.charCodeAt(0)),cells=[];
 for(let r=0;r<W.rows;r++)for(let c=0;c<W.cols;c++){const i=r*W.cols+c;if(bits[i>>3]>>(i&7)&1)cells.push([c+(r%2?.5:0),r])}
 const N=cells.length,X=new Float32Array(N),Y=new Float32Array(N),A=new Float32Array(N),ph=new Float32Array(N),fq=new Float32Array(N),hl=new Uint8Array(N);
 /* the Bay Area, where the shops are */
 const bx=(-122.15+180)/W.dx-.5,by=(W.lat0-37.75)/W.dy;
 for(let i=0;i<N;i++){ph[i]=Math.random()*6.283;fq[i]=.7+Math.random()*1.1;const[c,r]=cells[i];if(Math.hypot(c-bx,r-by)<2.2)hl[i]=1}
 const rgb=v=>{v=v.trim();if(v[0]==='#'){if(v.length===4)v='#'+[...v.slice(1)].map(x=>x+x).join('');const n=parseInt(v.slice(1),16);return(n>>16&255)+','+(n>>8&255)+','+(n&255)}const m=v.match(/[\d.]+/g);return m?m.slice(0,3).join(','):'0,0,0'};
 const ctx=cv.getContext('2d');let w=0,h=0,dpr=1,rad=1,base=null,col='0,0,0',acc='0,0,0',px=-1e4,py=-1e4,on=0,target=0,raf=0,last=0;const R=120;
 const paint=t=>{ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);if(base)ctx.drawImage(base,0,0);if(on<=.001)return;ctx.setTransform(dpr,0,0,dpr,0,0);const s=t/1000;
  for(let i=0;i<N;i++){const dx=X[i]-px,dy=Y[i]-py,d2=dx*dx+dy*dy;if(d2>R*R)continue;const f=1-Math.sqrt(d2)/R,a=f*f*on*(.5+.5*Math.sin(s*fq[i]*6.283+ph[i]));if(a<.02)continue;
   ctx.fillStyle='rgba('+(hl[i]||ph[i]<.9?acc:col)+','+Math.min(1,a)+')';ctx.beginPath();ctx.arc(X[i],Y[i],rad*(1+.6*a),0,6.283);ctx.fill()}};
 const layout=()=>{const b=sec.getBoundingClientRect();w=b.width;h=b.height;if(!w||!h)return;dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  /* the map fills the hero's height; on narrow screens its sides are cropped, keeping the Bay Area in view */
  const asp=(W.cols*W.dx)/(W.rows*W.dy),mw=Math.min((h-24)*asp,Math.max(w-32,w*2)),mh=mw/asp,bf=(bx+.5)/W.cols,ox=mw>w-32?Math.min(0,Math.max(w-mw,w*.14-bf*mw)):(w-mw)/2,oy=(h-mh)/2,sx=mw/W.cols,sy=mh/W.rows;rad=Math.max(.75,sx*.19);

  for(let i=0;i<N;i++){const[c,r]=cells[i];X[i]=ox+(c+.5)*sx;Y[i]=oy+(r+.5)*sy;const t=r/W.rows;let a=(t<.32?.18+.82*t/.32:1)*(t>.86?Math.max(.2,1-(t-.86)/.14*.8):1);
   const narrow=w<700,fb=narrow?90:130,yb=(h-Y[i])/fb;if(yb<1){const k=Math.max(0,yb);a*=k*k*(3-2*k)}
   const ex=(X[i]-w/2)/(narrow?w*.52:Math.min(w*.34,420)),ey=(Y[i]-h/2)/(h*(narrow?.36:.3)),e=Math.sqrt(ex*ex+ey*ey);if(e<1){const k=e*e*(3-2*e);a*=.12+.88*k}A[i]=a}
  const cs=getComputedStyle(document.documentElement);col=rgb(cs.getPropertyValue('--fg'));acc=rgb(cs.getPropertyValue('--accent'));const dotA=document.documentElement.dataset.theme==='light'?.55:.42;
  base=document.createElement('canvas');base.width=cv.width;base.height=cv.height;const g=base.getContext('2d');g.scale(dpr,dpr);

   cm.setOffset([f.dx,f.up?-46:f.h+10]);card.style.transformOrigin=`${Math.round(f.w/2-f.dx)}px ${f.up?'100%':'0'}`;
   if(pan&&f.dy)map.panBy([0,f.dy],{duration:REDUCE.matches?0:250})};
  /* where the card goes for a pin at screen point p: above or below it, kept inside the map; dy = how far the map must move for it to fit */

  let ptype='mouse';box.addEventListener('pointerdown',e=>{ptype=e.pointerType},true);

  box.addEventListener('click',e=>{const p=e.target.closest('.pin');if(!p)return;const k=p.dataset.k;pinned=k;show(k,true);if(!WIDE.matches)return;
   if(ptype==='mouse'||!e.detail){mark(k);if(WIDE.matches&&onCard)onCard.scrollIntoView({block:'nearest',behavior:REDUCE.matches?'auto':'smooth'})}
   else{mark(k);if(onCard){const lr=list.getBoundingClientRect(),cr=onCard.getBoundingClientRect();list.scrollTo({top:list.scrollTop+cr.top-lr.top-8,behavior:REDUCE.matches?'auto':'smooth'})}}});

  hideCard=hide;
  map.on('move',e=>{if(!WIDE.matches||!cur||!e.originalEvent)return;const s=BY[cur],p=map.project([s.lng,s.lat]);if(p.x<0||p.y<0||p.x>box.clientWidth||p.y>box.clientHeight)hide()});

  WIDE.addEventListener('change',()=>{card.classList.remove('open');card.setAttribute('aria-hidden','true');pinned=null;if(WIDE.matches){listClose(false);selPin(null);mark(null)}else pick(cur||SH[0].k,false,true)});

  list.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const c=e.target.closest('.shop');setHot(c?c.dataset.shop:null)});
  list.addEventListener('pointerleave',()=>setHot(null));

  map.once('load',()=>list.classList.add('hasmap'));
  list.addEventListener('click',e=>{if(e.target.closest('a,button')||!list.classList.contains('hasmap'))return;const c=e.target.closest('.shop');if(!c)return;const k=c.dataset.shop,s=BY[k];if(!s)return;
   if(getSelection&&String(getSelection()).length)return;
   const fast=REDUCE.matches;
   /* phones and tablets: the list closes, the shop's card comes up in the row and the map flies to its pin */
   if(!WIDE.matches){listClose(false);pick(k,false,true,false);map.easeTo({center:[s.lng,s.lat],zoom:Math.max(map.getZoom(),13),offset:[0,above()],duration:fast?0:600});return}
   /* desktop: the pin turns red and its card opens right away, already set where it will sit once the map stops,
      so it rides along with the pin in one smooth move and never shifts at the end */
   pinned=k;mark(k);show(k);
   const f=fit({x:box.clientWidth/2,y:box.clientHeight/2});place(s,false,{x:box.clientWidth/2,y:box.clientHeight/2-f.dy});
   map.easeTo({center:[s.lng,s.lat],zoom:Math.max(map.getZoom(),13),offset:[0,-f.dy],duration:fast?0:600})});
  /* follow the site theme. Once the map is idle the other theme's style is fetched, so switching is instant (markers and the card stay) */
 };

})();

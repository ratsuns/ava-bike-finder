__HEAD__
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap" rel="stylesheet">
<style>
/* home page rules this page uses (build2.py copies them from site_tpl.html, so tokens, themes and the shop cards stay identical) */
__BASE_CSS__
/* shops page */
:root{--mapbg:#f8f4f0}
.sbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);--hink:18,22,20}
:root[data-theme="dark"] .sbar{--hink:238,241,238}
.sbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:56px;max-width:1440px}
.sbar .themebtn{margin-right:-8px}
.spg{max-width:1440px;padding-block:24px 72px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "map" "list"}
.sphead{grid-area:head}
.sphead h1{font-size:var(--t-h2);line-height:1.2;letter-spacing:-.025em;font-weight:700;margin:0 0 4px;text-wrap:balance}
.sphead p{margin:0;color:var(--fg2);text-wrap:pretty}
.spmap{grid-area:map;position:relative;height:clamp(280px,45vh,460px);height:clamp(280px,45svh,460px);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--mapbg);isolation:isolate}
.splist{grid-area:list;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-content:start}
@media (min-width:1024px){
 .spg{grid-template-columns:minmax(360px,440px) minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"head map" "list map";column-gap:24px}
 .spmap{position:sticky;top:72px;align-self:start;height:calc(100vh - 88px);height:calc(100svh - 88px)}
 .splist{grid-template-columns:minmax(0,1fr)}
}
.splist .shop{scroll-margin:72px 0 16px}
.shop.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.spmap.nomap::after{content:"The map couldn't load. Every shop is listed here.";position:absolute;inset:0;z-index:10;background:var(--mapbg);display:grid;place-items:center;padding:24px;text-align:center;color:var(--fg2);font-size:var(--t-ui)}
/* pins: one per shop, in the site's green with a white ring; the open or hovered one grows a little and sits on top */
.pin{display:block;width:32px;height:40px;padding:4px 2px 0;margin:0;border:0;background:none;cursor:pointer;touch-action:manipulation}
.pin svg{display:block;width:28px;height:36px;transform-origin:50% 100%;transition:transform .15s var(--ease-out);filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.35))}
.pin .pb{fill:var(--accent);stroke:#fff;stroke-width:2}
.pin .pd{fill:#fff}
.maplibregl-marker.pin.hot{z-index:3}
.maplibregl-marker.pin.sel{z-index:4}
.pin.hot svg,.pin.sel svg{transform:scale(1.2)}
.pin:focus-visible{outline:none}
.pin:focus-visible svg{outline:2px solid var(--fg);outline-offset:1px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%}
/* hover card: one element, reused for every pin; it grows out of the pin (or drops below it near the top edge) */
.maplibregl-marker.mcw{z-index:6;pointer-events:none}
.mcard{width:296px;max-width:calc(100vw - 58px);display:grid;gap:10px;padding:14px 16px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;font-size:var(--t-ui);line-height:1.45;text-align:left;
 box-shadow:0 1px 2px rgba(18,22,20,.06),0 12px 32px rgba(18,22,20,.16);
 pointer-events:none;visibility:hidden;opacity:0;transform:scale(.96);transition:opacity .12s var(--ease-out),transform .12s var(--ease-out),visibility 0s linear .12s}
.mcard.open{pointer-events:auto;visibility:visible;opacity:1;transform:none;transition:opacity .15s var(--ease-out),transform .15s var(--ease-out),visibility 0s}
:root[data-theme="dark"] .mcard{border-color:var(--line2);box-shadow:0 2px 6px rgba(0,0,0,.35),0 16px 40px rgba(0,0,0,.55)}
@media (prefers-reduced-motion:reduce){.mcard,.mcard.open{transform:none}.pin svg{transition:none}}
.mctop{display:flex;align-items:center;gap:10px;min-width:0}
.mctop .slogo{margin:0}
.mcname{display:grid;min-width:0;overflow-wrap:anywhere}
.mcname .city{color:var(--accent-ink);font-weight:600;font-size:var(--t-micro)}
.mcname b{font-size:var(--t-body);font-weight:600;line-height:1.3}
.mclines{display:grid;gap:3px;color:var(--fg2)}
.mcl{display:flex;align-items:flex-start;gap:6px;color:inherit;text-decoration:none;width:fit-content;overflow-wrap:anywhere}
.mcl svg{flex:none;margin-top:calc((1lh - 13px) / 2);color:var(--fg3)}
a.mcl span{text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.mcacts{display:flex;gap:8px;flex-wrap:wrap}
.mcbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:6px;border:1px solid var(--line2);background:var(--surface);color:var(--fg);font-weight:600;font-size:var(--t-ui);text-decoration:none;transition:background-color .15s ease,border-color .15s ease}
.mcbtn svg{color:var(--fg3)}
.mcbtn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
@media (hover:hover) and (pointer:fine){a.mcl:hover{color:var(--fg)}a.mcl:hover span{text-decoration-color:currentColor}.mcbtn:hover{border-color:var(--fg3)}.mcbtn.pri:hover{background:var(--accent-ink);border-color:var(--accent-ink)}:root[data-theme="dark"] .mcbtn.pri:hover{background:#3cc08c;border-color:#3cc08c}}
@media (pointer:coarse){.mcbtn{height:40px}.mcl{padding-block:3px}}
/* map controls in the site's colors */
.spmap .maplibregl-ctrl-group{background:var(--surface);border-radius:8px;box-shadow:0 0 0 1px var(--line2),0 2px 8px rgba(18,22,20,.08)}
.spmap .maplibregl-ctrl-group button+button{border-top-color:var(--line)}
.spmap .maplibregl-ctrl-attrib{font-family:var(--font);font-size:11px}
:root[data-theme="dark"] .spmap .maplibregl-ctrl-icon,:root[data-theme="dark"] .spmap .maplibregl-ctrl-attrib-button{filter:invert(1)}
:root[data-theme="dark"] .spmap .maplibregl-ctrl-attrib{background:rgba(23,27,25,.8);color:var(--fg2)}
:root[data-theme="dark"] .spmap .maplibregl-ctrl-attrib.maplibregl-compact{background:var(--surface)}
:root[data-theme="dark"] .spmap .maplibregl-ctrl-attrib a{color:var(--fg2)}
</style>
</head><body data-overlayscrollbars-initialize style="margin:0">
<header class="sbar"><div class="wrap"><a class="brand" href="./"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="17" r="3.5"/><circle cx="18.5" cy="17" r="3.5"/><path d="M5.5 17 9 9h6l3.5 8M12 17l3-8M8 6h3"/></svg><span>Ava Bike Finder</span></a><button type="button" class="themebtn" id="themebtn" aria-label="Switch to light mode"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><mask id="tmask"><rect width="24" height="24" fill="#fff"/><circle class="tm-cut" cx="17" cy="7" r="7" fill="#000"/></mask><circle class="tm-core" cx="12" cy="12" r="8.5" fill="currentColor" mask="url(#tmask)"/><g class="tm-rays" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1.5v2M12 20.5v2M1.5 12h2M20.5 12h2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M4.6 19.4 6 18M18 6l1.4-1.4"/></g></svg></button></div></header>
<main class="wrap spg">
<div class="sphead"><h1>Where to buy</h1><p>Every participating shop. Call ahead to check stock; the rebate only works in person.</p></div>
<div class="spmap" id="map" role="region" aria-label="Map of the shops"></div>
<div class="splist" id="list"></div>
</main>
<script>
/* shop cards: drawn right away from the inline list, with the same helpers and markup as the home page's "Where to buy" */
const SH=__SHOPS__;
const $=id=>document.getElementById(id);
__HELPERS__
SH.sort((a,b)=>(a.city||'').localeCompare(b.city||'')||a.name.localeCompare(b.name));
/* the first few logos load right away; the rest wait until they're scrolled near */
$('list').innerHTML=SH.map((s,i)=>{const h=__CARD__;return i<6?h.replace('loading="lazy"','loading="eager"'):h}).join('');
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)');
/* light / dark toggle: same as the home page (remembered per browser, crossfades where view transitions exist) */
(()=>{const b=$('themebtn');if(!b)return;const H=document.documentElement;
 const cur=()=>H.dataset.theme==='light'?'light':'dark';
 const label=()=>{const t=cur();b.setAttribute('aria-label',t==='dark'?'Switch to light mode':'Switch to dark mode')};
 const apply=t=>{H.dataset.theme=t;const cs=document.querySelector('meta[name="color-scheme"]'),tc=document.querySelector('meta[name="theme-color"]');if(cs)cs.content=t;if(tc)tc.content=t==='light'?'#f6f7f5':'#0f1211';try{localStorage.setItem('theme',t)}catch(e){}label()};
 label();
 b.addEventListener('click',()=>{const next=cur()==='dark'?'light':'dark';
  if(document.startViewTransition&&!REDUCE.matches){b.style.viewTransitionName='themebtn';const vt=document.startViewTransition(()=>apply(next));vt.finished.finally(()=>{b.style.viewTransitionName=''})}else apply(next)})})();
/* map: starts as soon as MapLibre (loaded with defer in the head) is ready */
(()=>{const box=$('map'),list=$('list'),H=document.documentElement;
 /* OSM Bright in both light and dark mode, so switching the site's theme never reloads the map */
 const STY={light:'https://tiles.openfreemap.org/styles/bright',dark:'https://tiles.openfreemap.org/styles/bright'};
 const theme=()=>H.dataset.theme==='light'?'light':'dark';
 const BY={};SH.forEach(s=>BY[s.k]=s);
 const dirUrl=s=>'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent([s.name,s.address,s.city,'CA'].filter(Boolean).join(', '));
 /* today's hours (Pacific time) from lines like "Closed Mon · Tue–Fri 11a–6p · Sat 10a–6p"; anything else is shown as written */
 const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
 const inDays=(spec,d)=>spec.split(/,\s*/).some(x=>{const[a,b]=x.split('–'),i=DAYS.indexOf(a),j=b?DAYS.indexOf(b):i;return i>=0&&j>=0&&(i<=j?d>=i&&d<=j:d>=i||d<=j)});
 const today=h=>{if(!h)return'';let d;try{d=DAYS.indexOf(new Date().toLocaleString('en-US',{timeZone:'America/Los_Angeles',weekday:'short'}))}catch(e){d=new Date().getDay()}
  for(const p of h.split(' · ')){let m=p.match(/^Closed (.+)$/);if(m){if(inDays(m[1],d))return'Closed today';continue}
   m=p.match(/^(Daily|[A-Z][a-z]{2}(?:–[A-Z][a-z]{2})?(?:, [A-Z][a-z]{2}(?:–[A-Z][a-z]{2})?)*) (.+)$/);if(!m)return h;if(m[1]==='Daily'||inDays(m[1],d))return'Today '+m[2]}
  return /\d/.test(h)?'Closed today':h};
 const cardHTML=s=>{const t=today(s.hours);return `<div class="mctop">${slogo(s)}<div class="mcname"><span class="city">${esc(s.city||'')}</span><b>${esc(s.name)}</b></div></div><div class="mclines">${s.address?`<span class="mcl">${PIN}<span>${esc(s.address)}</span></span>`:''}${t?`<span class="mcl">${CLOCK}<span>${esc(t)}</span></span>`:''}${s.phone?`<a class="mcl" href="${telUrl(s.phone)}">${PHONE}<span>${esc(s.phone)}</span></a>`:''}</div><div class="mcacts"><a class="mcbtn pri" href="${dirUrl(s)}" target="_blank" rel="noopener">Directions</a>${s.url?`<a class="mcbtn" href="${esc(s.url)}" target="_blank" rel="noopener">Website${EXT}</a>`:''}</div>`};
 const PINSVG='<svg viewBox="0 0 28 36" aria-hidden="true"><path class="pb" d="M14 34.6S3 24 3 14.2a11 11 0 0 1 22 0C25 24 14 34.6 14 34.6z"/><circle class="pd" cx="14" cy="14" r="4"/></svg>';
 const WIDE=matchMedia('(min-width: 1024px)');
 const init=()=>{if(!window.maplibregl){box.classList.add('nomap');return}
  const bounds=new maplibregl.LngLatBounds();SH.forEach(s=>bounds.extend([s.lng,s.lat]));
  let map;
  try{map=new maplibregl.Map({container:box,style:STY[theme()],bounds,fitBoundsOptions:{padding:{top:56,bottom:32,left:32,right:32},maxZoom:13},
   minZoom:7,maxZoom:17,maxBounds:[[-123.4,36.9],[-120.4,38.6]],renderWorldCopies:false,fadeDuration:0,pixelRatio:Math.min(devicePixelRatio||1,2),
   dragRotate:false,pitchWithRotate:false,touchPitch:false,
   /* where the map sits inside the scrolling page (one column), one finger scrolls the page and two move the map */
   cooperativeGestures:!WIDE.matches})}
  catch(e){box.classList.add('nomap');return}
  map.touchZoomRotate.disableRotation();map.keyboard.disableRotation();
  /* the map style mentions a few icons it doesn't ship; fill them with a blank so nothing errors */
  map.on('styleimagemissing',e=>{if(!map.hasImage(e.id))map.addImage(e.id,{width:1,height:1,data:new Uint8Array(4)})});
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');
  map.once('load',()=>performance.mark('map-load'));
  /* if the map style can't load, say so; the list works without it */
  let styled=false;map.once('style.load',()=>{styled=true});map.on('error',()=>{if(!styled)box.classList.add('nomap')});
  /* pins are made once; HTML markers stay put when the style changes with the theme */
  const pins=new Map();
  SH.forEach(s=>{const el=document.createElement('button');el.type='button';el.className='pin';el.dataset.k=s.k;el.setAttribute('aria-label',s.name+', '+s.city);el.innerHTML=PINSVG;
   new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([s.lng,s.lat]).addTo(map);pins.set(s.k,el)});
  /* the one hover card, kept on the map (hidden) so it can fade in from its closed state */
  const cw=document.createElement('div');cw.className='mcw';const card=document.createElement('div');card.className='mcard';card.setAttribute('aria-hidden','true');cw.append(card);
  const cm=new maplibregl.Marker({element:cw,anchor:'bottom'}).setLngLat([SH[0].lng,SH[0].lat]).addTo(map);
  let cur=null,pinned=null,t=0,onCard=null;
  /* above the pin when it fits, else below; never over the credits at the bottom. A tapped or clicked pin whose card doesn't fit either way nudges the map */
  const place=(s,pan)=>{const p=map.project([s.lng,s.lat]),W=box.clientWidth,Hh=box.clientHeight,w=card.offsetWidth,h=card.offsetHeight,cr=box.querySelector('.maplibregl-ctrl-bottom-right'),top=8,bot=Hh-8-(cr?cr.offsetHeight:0);
   const upTop=p.y-46-h,dnBot=p.y+10+h,up=upTop>=top||(dnBot>bot&&p.y-46-top>=bot-p.y-10);
   const l=p.x-w/2,dx=Math.round(Math.min(Math.max(l,8),W-8-w)-l);
   cm.setOffset([dx,up?-46:h+10]);card.style.transformOrigin=`${Math.round(w/2-dx)}px ${up?'100%':'0'}`;
   if(pan){const dy=up?Math.min(0,upTop-top):Math.max(0,dnBot-bot);if(dy)map.panBy([0,Math.round(dy)],{duration:REDUCE.matches?0:250})}};
  const show=(k,pan)=>{clearTimeout(t);const s=BY[k];if(!s)return;
   if(cur!==k){if(cur&&pins.get(cur))pins.get(cur).classList.remove('sel');cur=k;card.innerHTML=cardHTML(s);pins.get(k).classList.add('sel');cm.setLngLat([s.lng,s.lat])}
   place(s,pan);card.classList.add('open');card.setAttribute('aria-hidden','false')};
  const mark=k=>{if(onCard)onCard.classList.remove('on');onCard=k?list.querySelector(`.shop[data-shop="${CSS.escape(k)}"]`):null;if(onCard)onCard.classList.add('on')};
  const hide=()=>{clearTimeout(t);if(cur&&pins.get(cur))pins.get(cur).classList.remove('sel');cur=null;pinned=null;mark(null);card.classList.remove('open');card.setAttribute('aria-hidden','true')};
  /* leaving the pin or the card waits a moment, so the pointer can cross the gap between them; a clicked pin's card stays */
  const hideSoon=()=>{clearTimeout(t);t=setTimeout(()=>{if(pinned){if(cur!==pinned)show(pinned)}else hide()},150)};
  let ptype='mouse';box.addEventListener('pointerdown',e=>{ptype=e.pointerType},true);
  box.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const p=e.target.closest('.pin');if(p)show(p.dataset.k);else if(e.target.closest('.mcw'))clearTimeout(t)});
  box.addEventListener('pointerout',e=>{if(e.pointerType!=='mouse')return;const from=e.target.closest('.pin,.mcw');if(!from)return;const to=e.relatedTarget&&e.relatedTarget.closest?e.relatedTarget.closest('.pin,.mcw'):null;if(to!==from)hideSoon()});
  box.addEventListener('click',e=>{const p=e.target.closest('.pin');if(!p)return;const k=p.dataset.k;pinned=k;show(k,true);
   if(ptype==='mouse'||!e.detail){mark(k);if(WIDE.matches&&onCard)onCard.scrollIntoView({block:'nearest',behavior:REDUCE.matches?'auto':'smooth'})}});
  /* a tap or click on the map itself closes the card */
  map.on('click',e=>{const tg=e.originalEvent&&e.originalEvent.target;if(tg&&tg.closest&&tg.closest('.pin,.mcw'))return;hide()});
  box.addEventListener('focusin',e=>{const p=e.target.closest('.pin');if(p)show(p.dataset.k)});
  box.addEventListener('focusout',e=>{if(!e.relatedTarget||!e.relatedTarget.closest||!e.relatedTarget.closest('.pin,.mcw'))hideSoon()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&cur){const k=cur;hide();const p=pins.get(k);if(p&&box.contains(document.activeElement))p.blur()}});
  map.on('moveend',()=>{if(cur)place(BY[cur])});
  /* hovering a shop in the list lights up its pin */
  let hot=null;const setHot=k=>{if(hot===k)return;if(hot&&pins.get(hot))pins.get(hot).classList.remove('hot');hot=k;if(k&&pins.get(k))pins.get(k).classList.add('hot')};
  list.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const c=e.target.closest('.shop');setHot(c?c.dataset.shop:null)});
  list.addEventListener('pointerleave',()=>setHot(null));
  /* follow the site theme. Once the map is idle the other theme's style is fetched, so switching is instant (markers and the card stay) */
 };
 /* the map starts as soon as both its script and its stylesheet have arrived (they download in parallel with the page) */
 let started=false;const go=()=>{if(started||!window.MLCSS||(!window.maplibregl&&document.readyState!=='complete'&&!go.dcl))return;started=true;init()};
 document.addEventListener('DOMContentLoaded',()=>{go.dcl=1;go()});document.addEventListener('mlcss',go);go();
})();
</script>

<script>
/* page scrollbar (see the .os-theme-ava styles): only runs where the browser's own bar takes up space */
/* only with a real mouse (desktop): phones, tablets and touch screens always keep the device's own scrollbar and scrolling */
const osOff=()=>{document.documentElement.removeAttribute('data-overlayscrollbars-initialize');document.body.removeAttribute('data-overlayscrollbars-initialize')};
try{if(!matchMedia('(hover: hover) and (pointer: fine)').matches||matchMedia('(any-pointer: coarse)').matches)osOff();else{const{OverlayScrollbars,ClickScrollPlugin}=OverlayScrollbarsGlobal;OverlayScrollbars.plugin(ClickScrollPlugin);OverlayScrollbars({target:document.body,cancel:{nativeScrollbarsOverlaid:true,body:null}},{scrollbars:{theme:'os-theme-ava',autoHide:'scroll',autoHideDelay:1000,clickScroll:true}})}}
catch(e){osOff()}
</script>
</body></html>
